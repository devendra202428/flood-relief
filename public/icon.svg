  <circle cx="256" cy="235" r="95" fill="none" stroke="#ffffff" stroke-width="32" />
  <circle cx="256" cy="235" r="60" fill="#0f172a" />

  <!-- Lifebuoy red/orange stripes -->
  <path d="M256 140 L256 175" stroke="#ef4444" stroke-width="32" stroke-linecap="round" />
  <path d="M256 295 L256 330" stroke="#ef4444" stroke-width="32" stroke-linecap="round" />
  <path d="M161 235 L196 235" stroke="#ef4444" stroke-width="32" stroke-linecap="round" />
  <path d="M316 235 L351 235" stroke="#ef4444" stroke-width="32" stroke-linecap="round" />

  <!-- Center Aid Cross -->
  <rect x="244" y="215" width="24" height="40" rx="4" fill="#38bdf8" />
  <rect x="236" y="223" width="40" height="24" rx="4" fill="#38bdf8" />

  <!-- Waves of water at the base -->
  <path d="M120 340 C170 320 210 355 256 340 C302 325 342 360 392 340 C380 375 320 405 256 415 C192 405 132 375 120 340 Z" fill="url(#waveGrad)" opacity="0.9" />
  <path d="M145 365 C185 350 220 375 256 365 C292 355 325 380 367 365 C345 390 300 410 256 415 C212 410 167 390 145 365 Z" fill="#38bdf8" opacity="0.8" />
