<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with subtle squircle curve -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Protective Shield / Emblem Outline -->
  <path d="M256 70 C340 70 410 110 410 200 C410 320 256 420 256 420 C256 420 102 320 102 200 C102 110 172 70 256 70 Z" fill="#1e293b" opacity="0.6" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" />

